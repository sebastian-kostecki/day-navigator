<!-- @dsCard group="Oznaczenia" height=170 subtitle="Tony i kilka flag w stałej kolejności" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Flag — preview</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DayNav, h = React.createElement;
  function label(text) {
    return h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink-faint)', minWidth: 72 } }, text);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h('div', { className: 'dn-demo' },
      label('change'), h(D.Flag, { tone: 'change' }, 'Zmienione'), h(D.Flag, null, 'Z piątku'), h(D.Flag, null, 'Dziś'),
      label('info'), h(D.Flag, { tone: 'info' }, 'Zamknięte'),
      label('new'), h(D.Flag, { tone: 'new' }, 'Nowe')),
    h('div', { className: 'dn-demo' },
      label('kolejność'),
      h(D.Flag, { tone: 'new' }, 'Nowe'), h(D.Flag, { tone: 'change' }, 'Zmienione'),
      h(D.Flag, { tone: 'change' }, 'Draft'), h(D.Flag, { tone: 'change' }, 'W Do zrobienia'))));
</script>
</body>
</html>
