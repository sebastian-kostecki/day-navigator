<!doctype html>
<html>
<head><meta charset="utf-8"><title>AppHeader — preview</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DayNav, h = React.createElement;
  var nav = [
    { key: '1', label: 'Do zrobienia', active: true }, { key: '2', label: 'GitLab' }, { key: '3', label: 'GitHub' },
    { key: '4', label: 'Moje zadania' }, { key: '5', label: 'Czas pracy' }, { key: '6', label: 'Źródła' }
  ];
  function Demo() {
    var s = React.useState(true), running = s[0], set = s[1];
    return h('div', { style: { display: 'flex', flexDirection: 'column', gap: 12 } },
      h(D.AppHeader, { items: nav, clock: running ? '05:12:34' : '00:00:00', running: running, onToggle: function () { set(!running); } }),
      h(D.AppHeader, { items: nav, clock: '00:00:00', running: false }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
