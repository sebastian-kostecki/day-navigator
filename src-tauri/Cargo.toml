[package]
name = "day-navigator"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "day_navigator_lib"
# Desktop only: `staticlib`/`cdylib` exist for Tauri mobile targets and cost
# about 1 GB of artifacts per build configuration on Windows.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dunce = "1"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
# Exposes the unguarded write layer (`vault::fsops`, `Vault::apply`) to the
# integration tests only; production builds never enable it.
test-support = []

[dev-dependencies]
proptest = "1"
# Self dev-dependency: turns on `test-support` for `cargo test` alone.
day-navigator = { path = ".", features = ["test-support"] }

[target.'cfg(windows)'.dev-dependencies]
junction = "1"


# Line numbers in backtraces, without full debug info: keeps every test binary
# (each links the whole app) and its .pdb small.
[profile.dev]
debug = "line-tables-only"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
