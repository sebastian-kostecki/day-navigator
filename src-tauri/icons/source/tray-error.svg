<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tray icon, state "error": the app glyph on a transparent background, thicker
       strokes for 16 px. -->
  <defs>
    <mask id="cut">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="512" r="52" fill="#000"/>
      <circle cx="824" cy="200" r="248" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <circle cx="512" cy="512" r="410" fill="none" stroke="#FF7B72" stroke-width="120"/>
    <g transform="rotate(45 512 512)">
      <polygon points="512,170 632,512 392,512" fill="#FF7B72"/>
      <polygon points="392,512 632,512 512,854" fill="#8A93A3"/>
    </g>
  </g>
  <circle cx="824" cy="200" r="176" fill="#FF7B72"/>
</svg>
