<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon — preview</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DayNav, h = React.createElement;
  var names = ['plus', 'close', 'refresh', 'edit', 'eye', 'eye-off', 'external', 'chevron-left', 'chevron-right', 'wifi-off', 'alert-triangle', 'check-circle', 'repo', 'clock', 'folder'];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', { className: 'dn-demo', style: { gap: 20 } }, names.map(function (n) {
      return h('div', { key: n, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, minWidth: 80 } },
        h(D.Icon, { name: n, size: 20 }),
        h('span', { style: { fontFamily: 'var(--font-mono)', fontSize: 11, color: 'var(--ink-faint)' } }, n));
    })));
</script>
</body>
</html>
