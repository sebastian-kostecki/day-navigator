<!-- @dsCard group="Formularze" height=300 subtitle="pole, data, lista, textarea, wyłączone" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field — preview</title></head>
<body>
<div id="root" style="padding: 16px"></div>
<script>
  var D = window.DayNav, h = React.createElement;
  function Demo() {
    var s = React.useState('Praca');
    return h(D.Panel, null,
      h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'flex-end', padding: '12px 16px' } },
        h(D.Field, { id: 'f-title', label: 'Nowe zadanie', placeholder: 'Tytuł — wystarczy sam tytuł', grow: true }),
        h('div', { className: 'dn-field' }, h('span', { className: 'dn-field-label' }, 'Przestrzeń'),
          h(D.Segmented, { label: 'Przestrzeń', size: 'md', value: s[0], onChange: s[1], options: [{ value: 'Praca', label: 'Praca' }, { value: 'Prywatne', label: 'Prywatne' }] })),
        h(D.Field, { id: 'f-due', label: 'Termin', type: 'date', style: { width: 160 } }),
        h(D.Field, { id: 'f-prio', label: 'Priorytet', options: ['—', 'wysoki', 'normalny', 'niski'], style: { width: 140 } }),
        h(D.Button, { variant: 'primary' }, 'Dodaj')),
      h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: 12, alignItems: 'flex-start', padding: '0 16px 16px' } },
        h(D.Field, { id: 'f-note', label: 'Notatka', multiline: true, rows: 3, placeholder: 'Zwykły tekst, bez formatowania', grow: true }),
        h(D.Field, { id: 'f-off', label: 'Źródło (wyłączone)', value: 'GitLab', disabled: true, readOnly: true, style: { width: 200 } })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
