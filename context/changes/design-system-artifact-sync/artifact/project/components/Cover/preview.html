<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Day Navigator — Konsola — cover</title>
<style>
  html, body { margin: 0; background: var(--bg); }
  .cover { position: relative; width: 960px; height: 320px; background: var(--bg); overflow: hidden; }
  .band { position: absolute; left: 0; top: 0; }
  .accent { fill: var(--accent); }
  .raised { fill: var(--surface-raised); }
  .info { fill: var(--info); }
  .danger { fill: var(--danger); }
  .dot { fill: var(--line-strong); }
  .r-lg { rx: var(--radius-lg); ry: var(--radius-lg); }
  .r-sm { rx: var(--radius-sm); ry: var(--radius-sm); }
  .text { position: absolute; left: 40px; top: 148px; max-width: 880px; }
  .name { margin: 0; font-family: var(--font-sans); font-weight: 600; font-size: 64px; line-height: 0.95; letter-spacing: -0.02em; color: var(--ink-strong); }
  .tag { margin: 8px 0 0; max-width: 440px; font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="cover">
  <!--
    blocks: accent 420×120 (space-5 multiples), surface-raised 300×120, info 96×120, danger 48×48 — corners radius-lg / radius-sm

    pattern: dot grid at 24px (2 × space-3) on the surface-raised band, in line-strong — "precise, technical, mono": the console's tabular grid
    scales: gaps space-3 (12px), dots r=1.5, radii radius-lg (6px) and radius-sm (3px)
  -->
