[package]
name = "day-navigator"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"
default-run = "day-navigator"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Test-only fake of `glab` / `gh` (see `tests/cli_runner.rs`). Keeping it out of
# the installer depends on two rules:
# (a) `path` stays exactly `src/bin/fake_cli.rs`. tauri-cli 2.12.6 builds with
#     `cargo build --bins`, which skips the fake because its required feature is
#     off. Its own binary list (`get_binaries`, crates/tauri-cli/src/interface/
#     rust.rs:937-1023) drops `[[bin]]` entries whose required features are off,
#     and also drops the matching `src/bin/*` file, matched by path only, since
#     `fake-cli` != `fake_cli`. The NSIS bundler copies every listed non-main
#     binary into the installer and fails if one was not built.
# (b) `test-support` is never added to `default` features.
[[bin]]
name = "fake-cli"
path = "src/bin/fake_cli.rs"
required-features = ["test-support"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "day_navigator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dunce = "1"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2.5"
tauri-plugin-log = "2.10"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
# Exposes the unguarded write layer (`vault::fsops`, `Vault::apply`) to the
# integration tests only; production builds never enable it.
test-support = []

[dev-dependencies]
proptest = "1"
# Self dev-dependency: turns on `test-support` for `cargo test` alone.
day-navigator = { path = ".", features = ["test-support"] }

[target.'cfg(windows)'.dev-dependencies]
junction = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
