<!doctype html>
<html>
<head><meta charset="utf-8"><title>Segmented — preview</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DayNav, h = React.createElement;
  function Demo() {
    var a = React.useState('all'), b = React.useState('Praca');
    return h('div', { className: 'dn-demo' },
      h(D.Segmented, { label: 'Typ', value: a[0], onChange: a[1], options: [{ value: 'all', label: 'Wszystko' }, { value: 'iss', label: 'Zgłoszenia' }, { value: 'mr', label: 'MR-y' }] }),
      h(D.Segmented, { label: 'Przestrzeń', value: b[0], onChange: b[1], options: [{ value: 'Praca', label: 'Praca' }, { value: 'Prywatne', label: 'Prywatne' }] }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
